services:
  backend:
    build:
      context: .
    container_name: zavodmusic-backend
    command: python app.py
    environment:
      APP_PORT: "5000"
      APP_DEBUG: "0"
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./static:/app/static
    restart: unless-stopped

  admin:
    build:
      context: .
    container_name: zavodmusic-admin-backend
    command: python admin_app.py
    environment:
      APP_PORT: "5051"
      APP_DEBUG: "0"
    ports:
      - "5051:5051"
    volumes:
      - ./data:/app/data
      - ./static:/app/static
    restart: unless-stopped
